<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: meta('Something Went Wrong')}"></head>
<body>
<div class="login-wrap">
  <div class="sr-card login-card" style="text-align:center;">
    <div style="font-size:2.5rem; margin-bottom:14px;">&#9888;&#65039;</div>
    <h2 style="margin-top:0;">Something Went Wrong</h2>
    <p style="color:var(--sr-muted);" th:text="${status} != null ? ('Error ' + ${status}) : 'An unexpected error occurred.'">Error</p>
    <p style="color:var(--sr-muted); font-size:0.88rem;" th:if="${message != null and not #strings.isEmpty(message)}" th:text="${message}">Details</p>
    <a href="/" class="btn-gold" style="justify-content:center;">Back to Home</a>
  </div>
</div>
</body>
</html>
