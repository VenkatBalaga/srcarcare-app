<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: meta('Promo Codes')}"></head>
<body>
<div class="admin-shell">
  <div th:replace="~{admin/fragments/shell-head :: sidebar('promo-codes')}"></div>
  <main class="admin-main">
    <div th:replace="~{admin/fragments/shell-head :: topbar('Promo Codes')}"></div>
    <div th:replace="~{admin/fragments/shell-head :: alerts}"></div>

    <div style="display:grid; grid-template-columns:1.3fr 1fr; gap:24px;">
      <div class="table-responsive-sr">
        <table class="table-dark-sr">
          <thead><tr><th>Code</th><th>Discount</th><th>Valid</th><th>Usage</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            <tr th:each="p : ${promoCodes}">
              <td th:text="${p.code}">CODE</td>
              <td th:text="${p.discountType.name() == 'PERCENTAGE'} ? (${p.discountValue} + '%') : ('Rs.' + ${p.discountValue})">10%</td>
              <td th:text="${p.validFrom} + ' to ' + ${p.validTo}">Valid</td>
              <td th:text="${p.usageCount} + (${p.usageLimit} != null ? (' / ' + ${p.usageLimit}) : '')">0</td>
              <td><span th:class="${p.active} ? 'badge-active' : 'badge-inactive'" th:text="${p.active} ? 'Active' : 'Inactive'">Active</span></td>
              <td>
                <form th:action="@{/admin/promo-codes/{id}/delete(id=${p.id})}" method="post">
                  <button type="submit" class="btn-outline-gold" style="padding:6px 12px; font-size:0.78rem;" data-confirm="Delete this promo code?">Delete</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(promoCodes)}"><td colspan="6" style="color:var(--sr-muted);">No promo codes yet.</td></tr>
          </tbody>
        </table>
      </div>

      <div class="sr-card">
        <h4 style="margin-top:0;">Add Promo Code</h4>
        <form th:action="@{/admin/promo-codes/save}" method="post">
          <div style="margin-bottom:12px;">
            <label class="form-label">Code</label>
            <input type="text" name="code" class="form-control" required placeholder="e.g. WELCOME10" style="text-transform:uppercase;" />
          </div>
          <div style="margin-bottom:12px;">
            <label class="form-label">Discount Type</label>
            <select name="discountType" class="form-select" required>
              <option th:each="dt : ${discountTypes}" th:value="${dt}" th:text="${dt}"></option>
            </select>
          </div>
          <div style="margin-bottom:12px;">
            <label class="form-label">Discount Value</label>
            <input type="number" step="0.01" name="discountValue" class="form-control" required />
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
            <div>
              <label class="form-label">Valid From</label>
              <input type="date" name="validFrom" class="form-control" required />
            </div>
            <div>
              <label class="form-label">Valid To</label>
              <input type="date" name="validTo" class="form-control" required />
            </div>
          </div>
          <div style="margin-bottom:12px;">
            <label class="form-label">Usage Limit (optional)</label>
            <input type="number" name="usageLimit" class="form-control" placeholder="Leave blank for unlimited" />
          </div>
          <label class="form-label"><input type="checkbox" name="active" value="true" checked /> Active</label>
          <button type="submit" class="btn-gold" style="width:100%; justify-content:center; margin-top:14px;">Add Promo Code</button>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="/js/main.js"></script>
</body>
</html>
