<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: meta('Change Password')}"></head>
<body>
<div class="admin-shell">
  <div th:replace="~{admin/fragments/shell-head :: sidebar('change-password')}"></div>
  <main class="admin-main">
    <div th:replace="~{admin/fragments/shell-head :: topbar('Change Password')}"></div>
    <div th:replace="~{admin/fragments/shell-head :: alerts}"></div>

    <div class="sr-card" style="max-width:480px;">
      <form th:action="@{/admin/change-password}" method="post">
        <div style="margin-bottom:14px;">
          <label class="form-label">Current Password</label>
          <input type="password" name="currentPassword" class="form-control" required />
        </div>
        <div style="margin-bottom:14px;">
          <label class="form-label">New Password</label>
          <input type="password" name="newPassword" class="form-control" required minlength="6" />
        </div>
        <div style="margin-bottom:20px;">
          <label class="form-label">Confirm New Password</label>
          <input type="password" name="confirmPassword" class="form-control" required minlength="6" />
        </div>
        <button type="submit" class="btn-gold">Update Password</button>
      </form>
    </div>
  </main>
</div>
<script src="/js/main.js"></script>
</body>
</html>
