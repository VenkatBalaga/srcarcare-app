# ===============================
# SR CAR CARE - Application Config
# ===============================

spring.application.name=SR CAR CARE

# Server
# Most hosting platforms (Railway, Render, Fly.io, Heroku-style) inject PORT;
# SERVER_PORT remains supported as a fallback for manual/VPS deployments.
server.port=${PORT:${SERVER_PORT:8080}}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.servlet.session.timeout=30m

# ===============================
# Persistent embedded H2 database (file mode - survives restarts)
# Data directory is external to the jar so it can be backed up.
# ===============================
srcarcare.data-dir=${SRCARCARE_DATA_DIR:./data}
spring.datasource.url=jdbc:h2:file:${srcarcare.data-dir}/db/srcarcare;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SRCARCARE_DB_USER:srcarcare}
spring.datasource.password=${SRCARCARE_DB_PASSWORD:srcarcare_local_pw}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# open-in-view keeps the Hibernate session open through Thymeleaf rendering so
# lazy associations (vehicle, wash/service option, review images) can be
# navigated directly in templates without extra fetch-join boilerplate.
spring.jpa.open-in-view=true

# H2 console (disable in real production deployment by setting SRCARCARE_H2_CONSOLE=false)
spring.h2.console.enabled=${SRCARCARE_H2_CONSOLE:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===============================
# File uploads - persistent on-disk storage (not temp dirs)
# ===============================
srcarcare.upload-dir=${SRCARCARE_UPLOAD_DIR:${srcarcare.data-dir}/uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# Deployment readiness - base URL used for building absolute links (e.g. payment callbacks)
# Override with SRCARCARE_BASE_URL when deployed to a custom domain such as https://srcarcare.in
# ===============================
srcarcare.base-url=${SRCARCARE_BASE_URL:http://localhost:8080}

# ===============================
# PhonePe payment gateway configuration
# These MUST be supplied via environment variables in real deployments.
# Placeholders only - no real credentials are embedded in source.
# ===============================
srcarcare.phonepe.merchant-id=${PHONEPE_MERCHANT_ID:PLACEHOLDER_MERCHANT_ID}
srcarcare.phonepe.salt-key=${PHONEPE_SALT_KEY:PLACEHOLDER_SALT_KEY}
srcarcare.phonepe.salt-index=${PHONEPE_SALT_INDEX:1}
srcarcare.phonepe.env=${PHONEPE_ENV:SANDBOX}
srcarcare.phonepe.base-url=${PHONEPE_BASE_URL:https://api-preprod.phonepe.com/apis/pg-sandbox}

# ===============================
# Default admin bootstrap (used only on first run when no admin exists)
# Change the password immediately after first login via Admin > Change Password.
# ===============================
srcarcare.admin.default-username=${SRCARCARE_ADMIN_USER:admin}
srcarcare.admin.default-password=${SRCARCARE_ADMIN_PASSWORD:ChangeMe@123}

# Logging
logging.level.root=INFO
logging.level.com.srcarcare=INFO
server.error.include-message=always
server.error.include-stacktrace=never
